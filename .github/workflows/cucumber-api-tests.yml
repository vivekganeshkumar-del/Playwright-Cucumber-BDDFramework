name: Payment API - Cucumber BDD CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select Cucumber test suite"
        required: true
        type: choice
        options:
          - all
          - master
          - sanity
          - regression
          - datadriven
        default: sanity

jobs:
  cucumber-api-tests:
    name: Execute Payment API Automation
    runs-on: windows-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Start Payment Mock Server
      - name: Start Payment Mock Server
        shell: pwsh
        run: |
          Start-Process -FilePath "cmd.exe" `
            -ArgumentList '/c npm run mock:start > mock-server.log 2>&1' `
            -PassThru

          $serverReady = $false

          for ($i = 1; $i -le 30; $i++) {
            $client = $null

            try {
              $client = New-Object System.Net.Sockets.TcpClient
              $client.Connect("127.0.0.1", 8089)
              $serverReady = $true
              break
            }
            catch {
              Start-Sleep -Seconds 2
            }
            finally {
              if ($client) {
                $client.Dispose()
              }
            }
          }

          if (-not $serverReady) {
            if (Test-Path "mock-server.log") {
              Get-Content "mock-server.log"
            }

            throw "Payment Mock Server failed to start on port 8089"
          }

          Write-Host "Payment Mock Server is running on port 8089"

      # 5. Execute selected Cucumber test suite
      - name: Run Cucumber API Tests
        shell: pwsh
        run: |
          if ($env:TEST_SUITE -eq "all") {
            npm run test:bdd
          }
          else {
            npm run test:bdd -- --tags "@$env:TEST_SUITE"
          }
        env:
          TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || 'all' }}
          CI: "true"
          BASE_URL: ${{ secrets.BASE_URL }}
          PAYMENT_ENDPOINT: ${{ secrets.PAYMENT_ENDPOINT }}

      # 6. Upload Allure execution results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # 7. Upload Mock Server Logs
      - name: Upload Mock Server Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-mock-server-logs
          path: mock-server.log
          retention-days: 30
          if-no-files-found: warn